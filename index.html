<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fimanu-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fimanu — Embeddable Figma Activity Widgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- title, meta description, and canonical are set per-route by
         src/components/Seo.tsx via react-helmet-async -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fimanu" />
    <meta property="og:title" content="Fimanu" />
    <meta property="og:description" content="Visualize your creativity." />
    <meta property="og:url" content="https://figma-tracker.onrender.com/" />
    <meta property="og:image" content="https://figma-tracker.onrender.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fimanu Preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fimanu" />
    <meta name="twitter:description" content="Visualize your creativity." />
    <meta name="twitter:image" content="https://figma-tracker.onrender.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fimanu",
        "url": "https://figma-tracker.onrender.com/",
        "description": "Turn your Figma version history into embeddable activity heatmaps, streak badges, and file breakdowns for your README, Notion, or portfolio.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
